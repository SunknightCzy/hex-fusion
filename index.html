<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hex-fusion</title>
  <style>
    :root {
      --cell-w: 104px;
      --cell-h: 120px;
      --hex-clip: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 16%, #243561 0%, #141f3a 46%, #080d1a 100%);
      color: #e8e3da;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1.4px 1.4px at 18% 28%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.2px 1.2px at 68% 16%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1.4px 1.4px at 42% 64%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(1.1px 1.1px at 84% 54%, rgba(255, 255, 255, 0.5), transparent),
        radial-gradient(1.3px 1.3px at 56% 84%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1.1px 1.1px at 8% 76%, rgba(255, 255, 255, 0.45), transparent),
        radial-gradient(1.2px 1.2px at 30% 92%, rgba(255, 255, 255, 0.5), transparent);
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .brand {
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #e8e3da;
    }

    .scores {
      display: flex;
      gap: 10px;
    }

    .score-box {
      min-width: 92px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f3eee4;
      border-radius: 12px;
      padding: 7px 12px 9px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .score-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .score-value {
      display: block;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }

    /* 热量盒：堆芯热量显示 */
    .heat-box {
      min-width: 74px;
    }

    .heat-box .score-value {
      font-size: 15px;
    }

    .heat-box.heat-l0 {
      border-color: rgba(90, 170, 220, 0.45);
    }

    .heat-box.heat-l1 {
      border-color: rgba(230, 190, 90, 0.65);
    }

    .heat-box.heat-l2 {
      border-color: rgba(255, 150, 70, 0.8);
    }

    .heat-box.heat-l3 {
      border-color: rgba(255, 70, 60, 0.95);
      box-shadow: 0 0 14px rgba(255, 70, 60, 0.55);
    }

    .heat-box.heat-pop .heat-value {
      animation: heat-pop 0.28s ease;
    }

    /* 热量两行显示：上热量、中短横杠、下阈值，上下左右居中 */
    .heat-lines {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 36px;
    }

    .heat-value {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .heat-divider {
      width: 26px;
      height: 1px;
      background: rgba(255, 255, 255, 0.4);
      margin: 2px 0;
    }

    .heat-limit {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.75);
    }

    /* 散热率输入框 */
    .cool-box .score-label {
      font-size: 11px;
    }

    .cool-note {
      display: block;
      font-size: 10px;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
      white-space: nowrap;
    }

    .cool-input {
      width: 66px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(173, 196, 255, 0.25);
      color: #f3eee4;
      border-radius: 8px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      padding: 3px 4px;
      margin-top: 3px;
      transition: border-color 0.15s ease;
    }

    .cool-input:focus {
      outline: none;
      border-color: rgba(242, 179, 113, 0.8);
    }

    @keyframes heat-pop {
      0% {
        transform: scale(1);
      }
      40% {
        transform: scale(1.16);
      }
      100% {
        transform: scale(1);
      }
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .new-game {
      background: linear-gradient(180deg, #f0b35e, #e08e3c);
      color: #2a1c08;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 5px 14px rgba(224, 142, 60, 0.4);
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .new-game:hover {
      background: linear-gradient(180deg, #f6c277, #ec9a47);
      transform: translateY(-1px);
    }

    .new-game:active {
      transform: translateY(1px);
    }

    /* 反应过程显示切换按钮 */
    .toggle-reaction {
      background: rgba(255, 255, 255, 0.10);
      color: #e8e3da;
      border: 1px solid rgba(173, 196, 255, 0.25);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.3);
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    .toggle-reaction:hover {
      background: rgba(255, 255, 255, 0.17);
    }

    .toggle-reaction:active {
      transform: translateY(1px);
    }

    /* 关闭反应过程显示：按钮置灰提示当前状态 */
    .toggle-reaction.off {
      opacity: 0.62;
      border-color: rgba(255, 255, 255, 0.14);
    }

    #mainRow {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 12px;
      padding: 0 10px 10px;
    }

    #viewport {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    /* 聚变信息栏（固定于视口底部；固定高度+内部滚动，棋盘尺寸不再随日志行数变化） */
    #fusionBar {
      position: absolute;
      left: 50%;
      bottom: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(92%, 640px);
      height: 112px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(173, 196, 255, 0.16);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      z-index: 5;
    }

    #fusionBar.hidden {
      display: none;
    }

    .fp-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9fb4e8;
      margin-bottom: 12px;
    }

    .fp-log {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fp-empty {
      color: #7c8bb0;
      font-size: 13px;
      text-align: center;
      padding: 14px 0;
      line-height: 1.6;
    }

    .fp-item {
      background: rgba(120, 160, 255, 0.10);
      border: 1px solid rgba(173, 196, 255, 0.18);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #dfe6f5;
      animation: fp-in 0.25s ease-out both;
    }

    @keyframes fp-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fp-atom {
      color: #e8e3da;
      font-weight: 600;
    }

    .fp-atom sup,
    .fp-prod sup {
      font-size: 0.6em;
      font-weight: 700;
      color: #9fb6e8;
      margin-right: 1px;
    }

    .fp-plus {
      color: #7c8bb0;
      margin: 0 2px;
    }

    .fp-arrow {
      color: #f2b35e;
      font-weight: 800;
      margin: 0 2px;
    }

    .fp-prod {
      color: #4cc6ff;
      font-weight: 800;
    }

    .fp-note {
      color: #93a7cf;
      font-size: 12px;
      margin-left: 4px;
    }

    .fp-boom {
      display: block;
      text-align: center;
      color: #ff6f42;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    #game {
      position: relative;
      width: 840px;
      height: 720px;
      flex: 0 0 auto;
    }

    /* 旋转容器：整个棋盘（格子/棋子/轮廓/方向按钮）逆时针旋转 30°，
       点顶六边形变为平顶，六个轴向正好对齐 QWEASD 键位簇 */
    #boardWrap {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    #board {
      position: absolute;
      inset: 0;
      touch-action: none;
    }

    .cell,
    .tile-inner {
      clip-path: var(--hex-clip);
    }

    .cell {
      position: absolute;
      width: var(--cell-w);
      height: var(--cell-h);
      background: rgba(255, 255, 255, 0.045);
      box-shadow: inset 0 0 0 1px rgba(173, 196, 255, 0.10),
        inset 0 0 22px rgba(120, 160, 255, 0.07);
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--cell-w);
      height: var(--cell-h);
      transition: transform 0.16s ease-in-out;
      will-change: transform;
      pointer-events: none;
    }

    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #776e65;
      text-shadow: none;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18),
        0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .tile-inner.tile-appear {
      animation: pop-in 0.18s ease-out both;
    }

    /* 聚变产物：多段脉冲爆发（比普通合并更强烈，带辉光） */
    .tile-inner.tile-fusion {
      animation: fusion-burst 0.4s ease-out both;
    }

    /* 聚变参与原子：坍缩消融，被反应中心"吸走" */
    .tile-inner.tile-implode {
      animation: tile-implode 0.26s ease-in both;
    }

    @keyframes pop-in {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      70% {
        transform: scale(1.08);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fusion-burst {
      0% {
        transform: scale(0.2);
        opacity: 0;
        filter: brightness(2.6);
      }
      30% {
        transform: scale(1.3);
        opacity: 1;
        filter: brightness(1.9);
      }
      50% {
        transform: scale(0.94);
        filter: brightness(1.35);
      }
      70% {
        transform: scale(1.12);
        filter: brightness(1.12);
      }
      100% {
        transform: scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    @keyframes tile-implode {
      0% {
        transform: scale(1);
        opacity: 1;
        filter: brightness(1.6);
      }
      100% {
        transform: scale(0);
        opacity: 0;
        filter: brightness(3);
      }
    }

    .tile-1 {
      background: linear-gradient(160deg, #eaf7fb, #c8e9f5);
      color: #1f4e5e;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12), 0 0 14px rgba(110, 190, 230, 0.35);
    }

    .tile-2 {
      background: linear-gradient(160deg, #e3f2fb, #bfe0f2);
      color: #27566e;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12), 0 0 16px rgba(90, 170, 220, 0.4);
    }

    .tile-3 {
      background: linear-gradient(160deg, #e7f8ee, #c4eccf);
      color: #1f5c36;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12), 0 0 14px rgba(120, 210, 150, 0.35);
    }

    .tile-4 {
      background: linear-gradient(160deg, #fdf2cf, #f7e2a0);
      color: #7a5a14;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12), 0 0 16px rgba(230, 190, 90, 0.4);
    }

    .tile-8 {
      background: linear-gradient(160deg, #ffc089, #f2914e);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 6px 18px rgba(242, 145, 78, 0.45);
    }

    .tile-16 {
      background: linear-gradient(160deg, #ff9f6f, #f57a4f);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 6px 18px rgba(245, 122, 79, 0.45);
    }

    .tile-32 {
      background: linear-gradient(160deg, #ff8366, #f25c3a);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 6px 20px rgba(242, 92, 58, 0.5);
    }

    .tile-64 {
      background: linear-gradient(160deg, #ff6f42, #e84a23);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 6px 20px rgba(232, 74, 35, 0.5);
    }

    .tile-128 {
      background: linear-gradient(160deg, #ffd879, #f2b33c);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 6px 22px rgba(242, 179, 60, 0.5);
    }

    .tile-256 {
      background: linear-gradient(160deg, #ffd84d, #edb52e);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 6px 22px rgba(237, 181, 46, 0.5);
    }

    .tile-512 {
      background: linear-gradient(160deg, #ffe06a, #e8b21f);
      color: #3a2a05;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 0 26px rgba(255, 200, 60, 0.6);
    }

    .tile-1024 {
      background: linear-gradient(160deg, #c9a6ff, #a877f0);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 0 26px rgba(168, 119, 240, 0.55);
    }

    .tile-super {
      background: linear-gradient(160deg, #8a7bff, #5b4bd6);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2), 0 0 28px rgba(120, 100, 240, 0.6);
    }

    /* 超级★：多彩流动光效（色相旋转 + 渐变流动），3×★ 合并而成 */
    .tile-star {
      background: linear-gradient(135deg, #ff5e8a, #b45cff, #4cc6ff, #5dffb0, #ffd24c, #ff5e8a);
      background-size: 300% 300%;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2), 0 0 30px rgba(190, 130, 255, 0.85);
      animation: fusion-burst 0.4s ease-out both, star-flow 4s linear 0.45s infinite;
    }

    @keyframes star-flow {
      from {
        background-position: 0% 50%;
        filter: hue-rotate(0deg);
      }
      to {
        background-position: 300% 50%;
        filter: hue-rotate(360deg);
      }
    }

    .arrow {
      position: absolute;
      width: 58px;
      height: 58px;
      margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: rgba(120, 150, 230, 0.92);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 14px rgba(80, 120, 220, 0.45);
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      z-index: 3;
    }

    .arrow svg {
      width: 30px;
      height: 30px;
      display: block;
      transition: transform 0.15s ease;
    }

    .arrow:hover:not(:disabled) {
      background: #9db4ee;
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(120, 150, 230, 0.55);
    }

    .arrow:active:not(:disabled) {
      transform: scale(0.96);
    }

    .arrow:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .arrow:focus-visible {
      outline: 3px solid #f2b179;
      outline-offset: 3px;
    }

    #board.shake {
      animation: board-shake 0.22s ease;
    }

    @keyframes board-shake {
      0%,
      100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-5px);
      }
      50% {
        transform: translateX(5px);
      }
      75% {
        transform: translateX(-3px);
      }
    }

    .el-symbol {
      display: block;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .el-mass {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.01em;
      opacity: 0.95;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* 地图逆时针旋转 30° 后，原子文字反向回正，保持竖直（六边形形状仍倾斜） */
    .el-symbol,
    .el-mass {
      transform: rotate(30deg);
    }

    /* 切伦科夫辐射层：★ 越多，边框外放射状粒子越强（置于边框/按钮之下） */
    #cherenkov {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    #supernova {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    #mapOutline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      overflow: visible;
    }

    #mapOutline path {
      fill: none;
      stroke: rgba(173, 196, 255, 0.6);
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(120, 160, 255, 0.55));
    }

    /* 级联聚变进行中：地图边框变色并脉冲闪烁，提示"正在反应" */
    #mapOutline.reacting path {
      stroke: rgba(255, 170, 80, 0.95);
      stroke-width: 2;
      animation: outline-react 0.45s ease-in-out infinite;
    }

    @keyframes outline-react {
      0%,
      100% {
        stroke-opacity: 0.4;
        filter: drop-shadow(0 0 3px rgba(255, 150, 60, 0.4));
      }
      50% {
        stroke-opacity: 1;
        filter: drop-shadow(0 0 12px rgba(255, 150, 60, 1));
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 24, 0.72);
      backdrop-filter: blur(3px);
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-card {
      min-width: 300px;
      max-width: 90%;
      background: rgba(18, 26, 46, 0.94);
      border: 1px solid rgba(173, 196, 255, 0.18);
      border-radius: 22px;
      padding: 30px 28px 26px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 38px;
      color: #f3eee4;
    }

    .overlay-card p {
      margin: 0 0 20px;
      color: #b9c2d6;
      line-height: 1.5;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .overlay-actions button {
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      color: #fff;
    }

    .overlay-actions .primary {
      background: linear-gradient(180deg, #f0b35e, #e08e3c);
      color: #2a1c08;
    }

    .overlay-actions .secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #e8e3da;
    }

    .overlay-actions button:hover {
      filter: brightness(1.06);
    }

    @media (max-width: 540px) {
      #fusionBar {
        width: 96%;
        height: 96px;
        bottom: 6px;
        padding: 8px 10px;
      }

      .el-mass {
        font-size: 16px;
        top: 22px;
        left: 18px;
      }

      .topbar {
        gap: 10px;
        padding: 8px 10px;
      }

      .brand {

</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">hex-fusion</div>
      <div class="scores">
        <div class="score-box heat-box" id="heatBox" title="堆芯热量：每次聚变 +1；每回合散热基础值 1.5（每个 ★ 额外 +1）；达到上限失控，点「继续游戏」清空热量（合成 ★ 后上限 32）">
          <span class="score-label">🔥 热量</span>
          <span class="heat-lines">

    </header>

    <div id="mainRow">
      <main id="viewport">
        <div id="game">
          <div id="boardWrap">
            <div id="board"></div>
            <svg id="mapOutline" viewBox="0 0 840 720" preserveAspectRatio="none"></svg>
            <canvas id="cherenkov"></canvas>
            <canvas id="fx"></canvas>
            <div id="controls"></div>
          </div>

            <div class="overlay-card">
