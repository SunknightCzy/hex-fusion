    </div>
  </div>

  <canvas id="supernova"></canvas>

  <script>
    (() => {
      'use strict';

      /*
       * Hexagonal board model.
       *
       * Axial coordinates are (q, r). A radius-2 board contains the 19 cells
       * satisfying -2 <= q <= 2, -2 <= r <= 2 and -2 <= q + r <= 2.
       *
       * The six movement directions are the six axial neighbor vectors.  For a
       * direction d, cells on the same line parallel to d have the same
       * cross(q,r,d) = q*dr - r*dq value.  Sorting a line by projection onto d
       * gives the order from the far edge back toward the near edge, which is
       * exactly the order needed by the 2048 slide/merge rule.
       */
      const SQRT3 = Math.sqrt(3);
      const HEX_SIZE = 60;
      const CELL_W = SQRT3 * HEX_SIZE;
      const CELL_H = 2 * HEX_SIZE;
      const RADIUS = 3;
      const TOTAL_W = 840;
      const TOTAL_H = 720;
      const CENTER_X = TOTAL_W / 2;
      const CENTER_Y = TOTAL_H / 2;
      const ARROW_DIST = 420;
      const MOVE_MS = 160;
      // 级联聚变分步播放：两波之间的间隔（毫秒），留出上一波的爆裂/坍缩动画时间
      const CASCADE_STEP_MS = 550;
      // 同一步操作内多波级联聚变加速：第 1 波正常速度，之后每波动画倍速递增（间隔/时长 × CASCADE_SPEEDUP）
      const CASCADE_SPEEDUP = 0.78;
      // 级联加速后波间隔的下限（毫秒），避免后期波次过快失去可读性
      const CASCADE_MIN_DELAY_MS = 150;
      const SHOW_REACTION_KEY = 'hex2048.showReaction';
      // "别炸了"模式：热量系统 —— 每次聚变 +1、达到上限堆芯失控。
      // 每回合散热随棋盘上的 ★ 数量线性增加：基础散热（UI 可调，默认 1.5），
      // 每个 ★ 额外 +1（0 个★ 降 1.5，1 个★ 降 2.5，2 个★ 降 3.5，依此类推）。
      // 热度上限动态：合成 ★ 前为 16，合成出第一个人工元素（★）后提升到 32。
      const HEAT_LIMIT_BASE = 16;
      const HEAT_LIMIT_AFTER_ARTIFICIAL = 32;
      const HEAT_COOL_DEFAULT = 1.5;
      const HEAT_COOL_KEY = 'hex2048.heatCool';
      const HEAT_COOL_PER_STAR = 1;
      const HEAT_PER_FUSION = 1;
      // 人工元素 = ★（999，人工合成超重核，游戏终点）；超级★（1000，3×★合并，多彩流动光效）
      const ARTIFICIAL_VALUES = new Set([999, 1000]);
      // 超级★：辐射增益等同 3 颗普通★
      const SUPER_STAR_VALUE = 1000;
      const SUPER_STAR_RADIATION_WEIGHT = 3;

      const DIRS = [
        { name: 'E', q: 1, r: 0 },
        { name: 'NE', q: 1, r: -1 },
        { name: 'NW', q: 0, r: -1 },
        { name: 'W', q: -1, r: 0 },
        { name: 'SW', q: -1, r: 1 },
        { name: 'SE', q: 0, r: 1 }
      ];

      const VALUE_CLASSES = {
        1: 'tile-1',
        2: 'tile-2',
        3: 'tile-3',
        4: 'tile-4',
        12: 'tile-8',
        16: 'tile-16',
        20: 'tile-32',
        24: 'tile-64',
        28: 'tile-128',
        56: 'tile-256',
        197: 'tile-512',
        238: 'tile-1024',
        999: 'tile-super',
        1000: 'tile-star'
      };

      function makeRegularCells(radius) {
        const cells = [];
        for (let q = -radius; q <= radius; q += 1) {
          for (let r = -radius; r <= radius; r += 1) {
            if (Math.abs(q + r) <= radius) {
              cells.push({ q, r });
            }
          }
        }
        return cells;
      }

      // 固定棋盘：半径 3 大图（37 格），聚变装置
      const CELLS = makeRegularCells(3);

      function key(q, r) {
        return q + ',' + r;
      }

      function keyOf(cell) {
        return key(cell.q, cell.r);
      }

      // 棋盘全部格子的键集合（就近空位搜索用）
      const BOARD_KEYS = new Set(CELLS.map(keyOf));

      function hexToPixel(q, r) {
        return {
          x: SQRT3 * HEX_SIZE * (q + r / 2),
          y: 1.5 * HEX_SIZE * r
        };
      }

      function getLanes(direction) {
        const lanes = new Map();

        for (const cell of CELLS) {
          const cross = cell.q * direction.r - cell.r * direction.q;
          if (!lanes.has(cross)) {
            lanes.set(cross, []);
          }
          lanes.get(cross).push(cell);
        }

        const ordered = [];
        for (const cells of lanes.values()) {
          cells.sort((a, b) => {
            const projectionA = a.q * direction.q + a.r * direction.r;
            const projectionB = b.q * direction.q + b.r * direction.r;
            return projectionB - projectionA;
          });
          ordered.push(cells);
        }

        // Deterministic order is nice for debugging and tests.
        ordered.sort((a, b) => {
          const crossA = a[0].q * direction.r - a[0].r * direction.q;
          const crossB = b[0].q * direction.r - b[0].r * direction.q;
          return crossA - crossB;
        });

        return ordered;
      }

      /*
       * Pure move calculation.  Returns null when the requested move changes
       * nothing.  Otherwise returns single-tile moves, merges, the score gained
       * from merges, and the largest value produced by a merge.
       */
      function computeMove(grid, direction) {
        const moves = [];
        const merges = [];
        let scoreGain = 0;
        let maxMerged = 0;

        for (const lane of getLanes(direction)) {
          // 不规则地图的巷道可能有缺口：按连续段分别滑动，缺口即墙
          const segments = [];
          let seg = [];
          for (let i = 0; i < lane.length; i += 1) {
            if (seg.length === 0) {
              seg.push(lane[i]);
              continue;
            }
            const prev = seg[seg.length - 1];
            const cur = lane[i];
            // 巷道按投影降序(远→近)排列,相邻格相差 -d
            if (cur.q - prev.q === -direction.q && cur.r - prev.r === -direction.r) {
              seg.push(cur);
            } else {
              segments.push(seg);
              seg = [cur];
            }
          }
          if (seg.length) {
            segments.push(seg);
          }

          for (const laneSeg of segments) {
            const compact = [];
            for (const cell of laneSeg) {
              const tile = grid.get(keyOf(cell));
              if (tile) {
                compact.push(tile);
              }
            }

            if (compact.length === 0) {
              continue;
            }

            // Standard 2048 merge rule: equal adjacent values merge pairwise,
            // left/right or near/far, with each tile participating at most once.
            const outputs = [];
            let index = 0;
            while (index < compact.length) {
              const current = compact[index];
              if (
                index + 1 < compact.length &&
                compact[index + 1].value === current.value
              ) {
                const value = current.value * 2;
                outputs.push({
                  value,
                  tiles: [current, compact[index + 1]],
                  merge: true
                });
                scoreGain += value;
                maxMerged = Math.max(maxMerged, value);
                index += 2;
              } else {
                outputs.push({
                  value: current.value,
                  tiles: [current],
                  merge: false
                });
                index += 1;
              }
            }

            // Compacted outputs occupy the farthest cells in the lane segment.
            for (let outputIndex = 0; outputIndex < outputs.length; outputIndex += 1) {
              const output = outputs[outputIndex];
              const target = laneSeg[outputIndex];

              if (output.merge) {
                merges.push({
                  toQ: target.q,
                  toR: target.r,
                  value: output.value,
                  tiles: output.tiles
                });
              } else {
                const tile = output.tiles[0];
                const fromQ = tile.q;
                const fromR = tile.r;
                if (fromQ !== target.q || fromR !== target.r) {
                  moves.push({
                    tile,
                    fromQ,
                    fromR,
                    toQ: target.q,
                    toR: target.r
                  });
                }
              }
            }
          }
        }

        if (moves.length === 0 && merges.length === 0) {
          return null;
        }

        return { moves, merges, scoreGain, maxMerged };
      }

      function hasAnyMove(grid) {
        for (const direction of DIRS) {
          if (computeMove(grid, direction)) {
            return true;
          }
        }
        return false;
      }

      // ---------- "别炸了"模式：人工聚变装置中的核合成链 ----------
      // needs: {元素值(质量数): 需要的个数}；中心格 + 六邻格内凑齐即可反应。
      // 设定：玩家在人工聚变装置中轰击核素（数值 = 同位素质量数）。
      // 逐条对应真实核反应（与恒星核合成同源的物理过程）：
      //   聚变链（轻核聚变，均为真实核反应；氘 ²H 记作 D，标注质量角标）：
      //     ¹H+¹H → D+e⁺+ν         pp-I 链第一步
      //     D+¹H → ³He+γ           pp-I 链第二步
      //     ³He+³He → ⁴He+2¹H      pp-I 链闭合（释放两个质子，副产品已实现）
      //     3×⁴He → ¹²C+γ          三α 过程
      //     ¹²C+⁴He → ¹⁶O+γ        α 俘获
      //     ¹⁶O+⁴He → ²⁰Ne+γ       α 俘获
      //     ²⁰Ne+⁴He → ²⁴Mg+γ      α 俘获
      //     ²⁴Mg+⁴He → ²⁸Si+γ      α 俘获
      //     2×²⁸Si → ⁵⁶Ni → ⁵⁶Fe   硅燃烧；⁵⁶Ni 双 β⁺ 衰变成 ⁵⁶Fe（产物按 Fe 显示）
      //   人工路径（中子暴抽象，非真实反应）：铁峰之后恒星不会自发两两聚变（吸热），
      //   真实机制是中子俘获（超新星 s/r 过程）；游戏以"中子暴"一步到位抽象，
      //   质量数不守恒，差额由中子暴补足：
      //     3×⁵⁶Fe + 中子暴 → ¹⁹⁷Au        （168 → 197）
      //     2×¹⁹⁷Au + 中子暴 → ²³⁸U + 2×⁵⁶Fe（394 → 350）
      //   2×U-238 → ★ 为游戏终点（人工合成超重核 ★），完全虚构，属游戏设定
      //   3×★ → 超级★（游戏设定：三颗星合并为带多彩流动光效的超级星，
      //   对切伦科夫辐射的增益等同 3 颗普通★）
      const FUSION_RECIPES = [
        { needs: { 1: 2 }, product: 2 },                                  // ¹H+¹H → ²D（pp链）
        { needs: { 2: 1, 1: 1 }, product: 3 },                            // ²D+¹H → ³He
        { needs: { 3: 2 }, product: 4, byproducts: [1, 1] },              // ³He+³He → ⁴He+2¹H（pp链闭合）
        { needs: { 4: 3 }, product: 12 },                                 // 3×⁴He → ¹²C（三α）
        { needs: { 12: 1, 4: 1 }, product: 16 },                          // ¹²C+⁴He → ¹⁶O
        { needs: { 16: 1, 4: 1 }, product: 20 },                          // ¹⁶O+⁴He → ²⁰Ne
        { needs: { 20: 1, 4: 1 }, product: 24 },                          // ²⁰Ne+⁴He → ²⁴Mg
        { needs: { 24: 1, 4: 1 }, product: 28 },                          // ²⁴Mg+⁴He → ²⁸Si
        { needs: { 28: 2 }, product: 56 },                                // 2×²⁸Si → ⁵⁶Fe（硅燃烧）
        { needs: { 56: 3 }, product: 197, neutronBurst: true },            // 3×⁵⁶Fe+中子暴 → ¹⁹⁷Au（r过程抽象）
        { needs: { 197: 2 }, product: 238, byproducts: [56, 56], neutronBurst: true }, // 2×¹⁹⁷Au+中子暴 → ²³⁸U+2×⁵⁶Fe（r过程抽象）
        { needs: { 238: 2 }, product: 999 },                              // 2×U-238 → ★（游戏终点）
        { needs: { 999: 3 }, product: 1000 }                              // 3×★ → 超级★（多彩流动光效，辐射增益等同 3 颗★）
      ];

      // 参与聚变的原子必须彼此六邻连通（真正的"接触"），
      // 不能只是同时落在某个中心格的 7 格范围内却隔空不相邻（会误触发）。
      function tilesConnected(tiles) {
        if (tiles.length <= 1) {
          return true;
        }
        const pos = new Map();
        for (const t of tiles) {
          pos.set(keyOf(t), t);
        }
        const visited = new Set([tiles[0].id]);
        const stack = [tiles[0]];
        while (stack.length) {
          const cur = stack.pop();
          for (const d of DIRS) {
            const n = pos.get(key(cur.q + d.q, cur.r + d.r));
            if (n && !visited.has(n.id)) {
              visited.add(n.id);
              stack.push(n);
            }
          }
        }
        return visited.size === tiles.length;
      }

      function findFusionReactions(grid, cells = CELLS) {
        const reactions = [];
        const cellSet = new Set(cells.map(keyOf));
        for (const center of cells) {
          const around = [center];
          for (const d of DIRS) {
            const n = { q: center.q + d.q, r: center.r + d.r };
            if (cellSet.has(keyOf(n))) {
              around.push(n);
            }
          }
          const centerTile = grid.get(keyOf(center));
          const counts = {};
          for (const c of around) {
            const t = grid.get(keyOf(c));
            if (t) {
              counts[t.value] = (counts[t.value] || 0) + 1;
            }
          }
          for (const recipe of FUSION_RECIPES) {
            let ok = true;
            for (const v in recipe.needs) {
              if ((counts[v] || 0) < recipe.needs[v]) {
                ok = false;
                break;
              }
            }
            if (!ok) {
              continue;
            }
            // 中心格若已被非配方元素占据 → 产物没地方落，换别的中心再试
            if (centerTile && !(recipe.needs[centerTile.value] > 0)) {
              continue;
            }
            const need = Object.assign({}, recipe.needs);
            const tiles = [];
            for (const c of around) {
              const t = grid.get(keyOf(c));
              if (t && need[t.value] > 0) {
                tiles.push(t);
                need[t.value] -= 1;
              }
            }
            if (tiles.length >= 2 && !tilesConnected(tiles)) {
              continue;
            }
            reactions.push({
              center,
              recipe,
              tiles,
              product: recipe.product,
              byproducts: recipe.byproducts || []
            });
            break;
          }
        }
        return reactions;
      }

      // 一波内同时发生的聚变（互不抢原子）。
      // 先按「同一批原子」去重：同一物理聚变会被多个中心格重复报告，
      // 若不合并，互斥贪心会白白浪费选择次数，把 3 个独立反应误算成 2 个。
      // 再用回溯精确求最大互不重叠反应集（候选数量小，可接受）。
      function computeFusionWave(grid, cells = CELLS) {
        const seen = new Map();
        for (const r of findFusionReactions(grid, cells)) {
          const key = r.tiles.map((t) => t.id).sort((a, b) => a - b).join(',');
          if (!seen.has(key)) {
            seen.set(key, r);
          }
        }
        const candidates = [...seen.values()];
        candidates.sort((a, b) => a.tiles.length - b.tiles.length);

        const n = candidates.length;
        const conflict = Array.from({ length: n }, () => []);
        const idSetCache = candidates.map((r) => new Set(r.tiles.map((t) => t.id)));
        for (let i = 0; i < n; i += 1) {
          for (let j = i + 1; j < n; j += 1) {
            let overlaps = false;
            for (const t of candidates[j].tiles) {
              if (idSetCache[i].has(t.id)) {
                overlaps = true;
                break;
              }
            }
            if (overlaps) {
              conflict[i].push(j);
              conflict[j].push(i);
            }
          }
        }

        let best = [];
        const chosen = [];
        function bt(start) {
          if (chosen.length > best.length) {
            best = chosen.slice();
          }
          // 剪枝：即便把后面全部选上也超不过当前最优
          if (chosen.length + (n - start) <= best.length) {
            return;
          }
          for (let i = start; i < n; i += 1) {
            if (chosen.some((j) => conflict[i].includes(j))) {
              continue;
            }
            chosen.push(i);
            bt(i + 1);
            chosen.pop();
          }
        }
        bt(0);
        return best.map((i) => candidates[i]);
      }

      // Expose pure logic for the verification harness, without requiring a DOM.
      if (typeof globalThis !== 'undefined') {
        globalThis.__hex2048Test = {
          RADIUS,
          CELLS,
          DIRS,
          getLanes,
          computeMove,
          hasAnyMove,
          key,
          keyOf,
          FUSION_RECIPES,
          findFusionReactions,
          computeFusionWave,
          makeRegularCells,
          findEmptyNeighbor
        };
      }

      if (typeof document === 'undefined' || !document.getElementById('board')) {
        return;
      }

      const boardEl = document.getElementById('board');
      const boardWrapEl = document.getElementById('boardWrap');
      const mapOutlineEl = document.getElementById('mapOutline');
      const gameEl = document.getElementById('game');
      const controlsEl = document.getElementById('controls');
      const heatBoxEl = document.getElementById('heatBox');
      const heatEl = document.getElementById('heat');
      const heatLimitEl = document.getElementById('heatLimit');
      const viewportEl = document.getElementById('viewport');
      const overlayEl = document.getElementById('overlay');
      const overlayTitleEl = document.getElementById('overlayTitle');
      const overlayTextEl = document.getElementById('overlayText');
      const overlayNewGameBtn = document.getElementById('overlayNewGameBtn');
      const keepGoingBtn = document.getElementById('keepGoingBtn');
      const newGameBtn = document.getElementById('newGameBtn');
      const toggleReactionBtn = document.getElementById('toggleReactionBtn');
      const coolInput = document.getElementById('coolInput');
      const fusionBarEl = document.getElementById('fusionBar');
      const fxCanvas = document.getElementById('fx');
      const fxCtx = fxCanvas.getContext('2d');
      const cherenkovCanvas = document.getElementById('cherenkov');
      const cherenkovCtx = cherenkovCanvas.getContext('2d');

      // 精细同位素链（数值 = 质量数）
      const NE_ELEMENT_BY_VALUE = {
        1: 'H', 2: 'D', 3: 'He', 4: 'He', 12: 'C', 16: 'O', 20: 'Ne',
        24: 'Mg', 28: 'Si', 56: 'Fe', 197: 'Au', 238: 'U', 999: '★', 1000: '★'
      };

      // "别炸了"模式：数值 → 相对原子质量（整数取质量数, 单位 u）
      const NE_ATOMIC_MASS_BY_VALUE = {
        1: '1',        // ¹H
        2: '2',        // ²H（氘）
        3: '3',        // ³He
        4: '4',        // ⁴He
        12: '12',      // ¹²C
        16: '16',      // ¹⁶O
        20: '20',      // ²⁰Ne
        24: '24',      // ²⁴Mg
        28: '28',      // ²⁸Si
        56: '56',      // ⁵⁶Fe
        197: '197',    // ¹⁹⁷Au
        238: '238',    // ²³⁸U
        999: '∞',      // 人工合成超重核 ★
        1000: '∞'      // 超级★（3×★ 合并）
      };

      // 当前模式下的元素符号 / 相对原子质量
      function elementSymbol(value) {
        return NE_ELEMENT_BY_VALUE[value] || '';
      }
      function atomicMass(value) {
        return NE_ATOMIC_MASS_BY_VALUE[value] || '';
      }

      // 聚变反应粒子表（按合并目标值；依据真实核过程抽象）
      const FUSION_FX = {
        2: { emit: ['e+', 'nu', 'gam'] },                        // H+H→D pp链:正电子+中微子+伽马
        3: { emit: ['e+', 'nu', 'gam'] },                        // D+H→He³
        4: { emit: ['p', 'p', 'gam'] },                          // He³+He³→He⁴+2H: 放出两个质子+伽马
        12: { emit: ['gam', 'gam', 'gam'] },                     // 3α→C¹²
        16: { emit: ['gam'], absorb: ['alp'] },                  // C+He→O α俘获成氧:吸收α、放伽马
        20: { emit: ['alp', 'p'] },                              // O+He→Ne 氧燃烧:出α+质子
        24: { emit: ['alp'] },                                   // Ne+He→Mg 氖燃烧光致蜕变:出α
        28: { emit: ['alp', 'gam'] },                            // Mg+He→Si
        56: { emit: ['n', 'gam', 'gam'] },                       // Si+Si→Fe 硅燃烧:中子+伽马
        197: { emit: ['n', 'n', 'nu', 'gam'], supernova: true }, // 铁种子 r过程→Au: 中子+中微子暴
        238: { emit: ['n', 'gam'] },                             // 重元素继续中子俘获
        999: { emit: ['gam', 'gam', 'gam'] }
      };
      const PARTICLE_COUNTS = { alp: 6, p: 7, n: 7, 'e+': 5, nu: 12, gam: 4 };

      let grid = new Map();
      let tileSeq = 0;
      // 是否显示聚变反应过程动画（关闭后瞬间结算，无动画/无边框提示）
      let showReaction = loadShowReaction();
      let busy = false;
      let won = false;
      let gameEnded = false;
      let moveToken = 0;
      // "别炸了"模式：堆芯热量（聚变+1 / 回合散热 / 到当前热度上限堆芯失控）
      let heat = 0;
      // 每回合散热基础值（顶栏 UI 可调，默认 1.5，localStorage 持久化）
      let heatCoolPerMove = loadHeatCool();
      // 是否已合成出第一个人工元素（★）：解锁后热度上限提升到 32，
      // 且每回合在每个 ★ 周围随机生成一个 H/D 燃料（散热按 ★ 数量线性叠加）
      let artificialUnlocked = false;
      // 堆芯失控（超阈值）后等待"继续游戏"：点击后清空热量继续（不判负）
      let boomContinue = false;
      // 最近一步滑动内发生的聚变反应（用于右侧"上一步聚变"提示）
      let fusionHistory = [];

      function loadShowReaction() {
        try {
          return localStorage.getItem(SHOW_REACTION_KEY) !== '0';
        } catch (_) {
          return true;
        }
      }

      function saveShowReaction() {
        try {
          localStorage.setItem(SHOW_REACTION_KEY, showReaction ? '1' : '0');
        } catch (_) {
          // localStorage may be unavailable in privacy-restricted contexts.
        }
      }

      // 散热率持久化与格式化
      function loadHeatCool() {
        try {
          const v = Number.parseFloat(localStorage.getItem(HEAT_COOL_KEY));
          if (Number.isFinite(v) && v >= 0 && v <= 30) {
            return v;
          }
        } catch (_) {
          // ignore
        }
        return HEAT_COOL_DEFAULT;
      }

      function saveHeatCool() {
        try {
          localStorage.setItem(HEAT_COOL_KEY, String(heatCoolPerMove));
        } catch (_) {
          // ignore
        }
      }

      function formatCool(v) {
        return Number.isInteger(v) ? String(v) : v.toFixed(1);
      }

      function tileValueClass(value) {
        return VALUE_CLASSES[value] || 'tile-super';
      }

      function makeTileElement(tile) {
        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.style.width = CELL_W + 'px';
        tileEl.style.height = CELL_H + 'px';

        const inner = document.createElement('div');
        inner.className = 'tile-inner ' + tileValueClass(tile.value);

        const symbolEl = document.createElement('span');
        symbolEl.className = 'el-symbol';
        symbolEl.textContent = elementSymbol(tile.value);
        inner.appendChild(symbolEl);

        // 原子左上角标注相对原子质量（元素卡片样式）
        const massEl = document.createElement('span');
        massEl.className = 'el-mass';
        massEl.textContent = atomicMass(tile.value);
        inner.appendChild(massEl);

        tileEl.appendChild(inner);
        setTileTransform(tileEl, tile.q, tile.r);
        boardEl.appendChild(tileEl);
        return tileEl;
      }

      function setTileTransform(tileEl, q, r) {
        const point = hexToPixel(q, r);
        tileEl.style.transform =
          'translate(' +
          (CENTER_X + point.x - CELL_W / 2) +
          'px, ' +
          (CENTER_Y + point.y - CELL_H / 2) +
          'px)';
      }

      function positionCell(cellEl, q, r) {
        const point = hexToPixel(q, r);
        cellEl.style.left = CENTER_X + point.x - CELL_W / 2 + 'px';
        cellEl.style.top = CENTER_Y + point.y - CELL_H / 2 + 'px';
      }

      function createTile(value, q, r, animate) {
        const tile = {
          id: ++tileSeq,
          value,
          q,
          r,
          el: null
        };
        grid.set(key(q, r), tile);
        tile.el = makeTileElement(tile);
        if (animate) {
          tile.el.querySelector('.tile-inner').classList.add('tile-appear');
        }
        return tile;
      }

      // 正在播放"坍缩"动画、延迟移除的原子 DOM（重开新局时强制清理）
      const lingeringTiles = [];
      const IMPLODE_MS = 260;
      // 聚变产物爆裂动画时长（毫秒）：最后一波播完即可解锁输入，不再多等整段波间隔
      const FUSION_BURST_MS = 400;

      function removeTileElement(tile) {
        if (tile.el && tile.el.parentNode) {
          tile.el.parentNode.removeChild(tile.el);
        }
        tile.el = null;
      }

      function clearBoard() {
        for (const el of lingeringTiles) {
          if (el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }
        lingeringTiles.length = 0;
        for (const tile of grid.values()) {
          removeTileElement(tile);
        }
        grid.clear();
      }

      function drawMapOutline() {
        const svg = document.getElementById('mapOutline');
        svg.setAttribute('viewBox', '0 0 ' + TOTAL_W + ' ' + TOTAL_H);
        while (svg.firstChild) {
          svg.removeChild(svg.firstChild);
        }
        const hw = CELL_W / 2;
        const hh = CELL_H / 2;
        // 六角格相对中心的六个角（与 clip-path 多边形一致）
        const rel = [
          [0, -hh], [hw, -hh / 2], [hw, hh / 2],
          [0, hh], [-hw, hh / 2], [-hw, -hh / 2]
        ];
        // 边 i 对应的邻居方向（DIRS 索引）：由边中点方向匹配得到
        const edgeForDir = [1, 0, 5, 4, 3, 2];
        const margin = 6;
        const cx = CENTER_X;
        const cy = CENTER_Y;
        const cellSet = new Set(CELLS.map(keyOf));
        const seg = [];
        for (const cell of CELLS) {
          const p = hexToPixel(cell.q, cell.r);
          const px = cx + p.x;
          const py = cy + p.y;
          for (let k = 0; k < 6; k += 1) {
            const nb = DIRS[k];
            if (!cellSet.has(key(cell.q + nb.q, cell.r + nb.r))) {
              const ei = edgeForDir[k];
              const a = rel[ei];
              const b = rel[(ei + 1) % 6];
              const A = expandPoint(px + a[0], py + a[1], cx, cy, margin);
              const B = expandPoint(px + b[0], py + b[1], cx, cy, margin);
              seg.push('M' + A.x.toFixed(1) + ' ' + A.y.toFixed(1) +
                'L' + B.x.toFixed(1) + ' ' + B.y.toFixed(1));
            }
          }
        }
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', seg.join(' '));
        svg.appendChild(path);
      }

      function expandPoint(x, y, cx, cy, m) {
        const dx = x - cx;
        const dy = y - cy;
        const len = Math.hypot(dx, dy) || 1;
        return { x: x + (dx / len) * m, y: y + (dy / len) * m };
      }

      function buildBoardCells() {
        boardEl.querySelectorAll('.cell').forEach((el) => el.remove());
        for (const cell of CELLS) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          positionCell(cellEl, cell.q, cell.r);
          boardEl.appendChild(cellEl);
        }
        drawMapOutline();
      }

      function arrowIcon() {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        // 单箭头（→ 样式）：简洁指向移动方向
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M4 12h16M14 6l6 6-6 6');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'currentColor');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);
        return svg;
      }

      function buildArrowButtons() {
        controlsEl.textContent = '';
        DIRS.forEach((direction, index) => {
          const vector = hexToPixel(direction.q, direction.r);
          const length = Math.hypot(vector.x, vector.y);
          const dx = (vector.x / length) * ARROW_DIST;
          const dy = (vector.y / length) * ARROW_DIST;
          const angle = (Math.atan2(dy, dx) * 180) / Math.PI;

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'arrow';
          button.dataset.direction = direction.name;
          button.setAttribute('aria-label', 'Move ' + direction.name);
          button.title = 'Move ' + direction.name;
          button.style.left = CENTER_X + dx + 'px';
          button.style.top = CENTER_Y + dy + 'px';

          const icon = arrowIcon();
          icon.style.transform = 'rotate(' + angle + 'deg)';
          button.appendChild(icon);
          button.addEventListener('click', () => handleMove(direction));
          controlsEl.appendChild(button);
        });
      }

      function setArrowsDisabled(disabled) {
        controlsEl.querySelectorAll('.arrow').forEach((button) => {
          button.disabled = disabled;
        });
      }

      function randomEmptyCell() {
        const empty = CELLS.filter((cell) => !grid.has(keyOf(cell)));
        if (empty.length === 0) {
          return null;
        }
        return empty[Math.floor(Math.random() * empty.length)];
      }

      function addRandomTile() {
        const cell = randomEmptyCell();
        if (!cell) {
          return null;
        }
        // 刷 H/D（1/2，质量数）
        const value = Math.random() < 0.9 ? 1 : 2;
        return createTile(value, cell.q, cell.r, true);
      }

      // 棋盘上 ★（人工元素）的数量：决定每回合额外散热与燃料生成
      function countArtificial() {
        let n = 0;
        for (const tile of grid.values()) {
          if (ARTIFICIAL_VALUES.has(tile.value)) {
            n += 1;
          }
        }
        return n;
      }

      // 人工元素强化：每回合在每个 ★ 周围随机空位生成一个 H 或 D 燃料；
      // 多个 ★ 的候选空位互不重叠（同回合内）
      function spawnFuelAroundArtificial() {
        if (!artificialUnlocked) {
          return;
        }
        const taken = new Set();
        for (const tile of grid.values()) {
          if (!ARTIFICIAL_VALUES.has(tile.value)) {
            continue;
          }
          const candidates = [];
          for (const d of DIRS) {
            const q = tile.q + d.q;
            const r = tile.r + d.r;
            const k = key(q, r);
            if (CELLS.some((c) => c.q === q && c.r === r) && !grid.has(k) && !taken.has(k)) {
              candidates.push({ q, r });
            }
          }
          if (candidates.length === 0) {
            continue;
          }
          const spot = candidates[Math.floor(Math.random() * candidates.length)];
          taken.add(key(spot.q, spot.r));
          const value = Math.random() < 0.9 ? 1 : 2;
          createTile(value, spot.q, spot.r, true);
        }
      }

      function startNewGame() {
        // 级联聚变动画期间锁定外界输入（触屏、点击等），不响应"新游戏"
        if (busy) {
          return;
        }
        moveToken += 1;
        clearBoard();
        busy = false;
        won = false;
        gameEnded = false;
        fusionHistory = [];
        heat = 0;
        artificialUnlocked = false;
        boomContinue = false;
        // 清理级联聚变遗留的"正在反应"边框高亮与粒子倍速
        mapOutlineEl.classList.remove('reacting');
        fxTimeScale = 1;
        updateHeatTitle();
        updateCherenkov();
        updateHeatUI(false);
        renderFusionLog();
        hideOverlay();
        setArrowsDisabled(false);

        addRandomTile();
        addRandomTile();
      }

      // ---------- 聚变粒子特效 ----------
      const fx = [];
      let fxRunning = false;
      // 级联加速时粒子特效的倍速（>1 更快）；寿命缩短 + 速度提高，飞行距离不变
      let fxTimeScale = 1;
      // 上一帧时间戳：按真实流逝时间推进（后台切回时残留粒子快速走完，不堆积）
      let lastFxTime = 0;

      // 按当前倍速缩放粒子的寿命与速度（倍速=1 时为无操作）
      function fxSpeed(p) {
        if (fxTimeScale !== 1) {
          p.maxLife /= fxTimeScale;
          p.vx *= fxTimeScale;
          p.vy *= fxTimeScale;
        }
        return p;
      }

      function fxDot(ctx, x, y, r, fill) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
      }

      function fxSpawn(x, y, type, absorb) {
        const angle = Math.random() * Math.PI * 2;
        const p = {
          x, y, type, absorb,
          life: 0,
          maxLife: absorb ? 0.4 : 0.6 + Math.random() * 0.35
        };
        if (absorb) {
          p.vx = -Math.cos(angle) * 320;
          p.vy = -Math.sin(angle) * 320;
          p.x += Math.cos(angle) * 48;
          p.y += Math.sin(angle) * 48;
        } else {
          const speed = 130 + Math.random() * 220;
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed;
        }
        fx.push(fxSpeed(p));
      }

      // 内聚粒子：从参与原子位置飞向反应中心（聚变"吸聚"感）
      function fxInward(x, y, cx, cy) {
        const dx = cx - x;
        const dy = cy - y;
        const len = Math.hypot(dx, dy) || 1;
        const speed = 460 + Math.random() * 180;
        fx.push(fxSpeed({
          x,
          y,
          type: 'gam',
          absorb: false,
          vx: (dx / len) * speed,
          vy: (dy / len) * speed,
          life: 0,
          maxLife: 0.24 + Math.random() * 0.12
        }));
      }

      function spawnFusionParticles(q, r, value) {
        const fxDef = FUSION_FX[value] || { emit: ['n', 'gam'] };
        const pt = hexToPixel(q, r);
        const cx = CENTER_X + pt.x;
        const cy = CENTER_Y + pt.y;
        (fxDef.emit || []).forEach((type) => {
          for (let i = 0; i < (PARTICLE_COUNTS[type] || 2); i += 1) {
            fxSpawn(cx, cy, type, false);
          }
        });
        (fxDef.absorb || []).forEach((type) => {
          for (let i = 0; i < (PARTICLE_COUNTS[type] || 2); i += 1) {
            fxSpawn(cx, cy, type, true);
          }
        });
        if (fxDef.supernova) {
          // 以 Au（197）产物棋子为中心触发超新星（从全屏中心改为 Au 所在位置）
          const prodTile = grid.get(key(q, r));
          let snCx;
          let snCy;
          if (prodTile && prodTile.el) {
            const rect = prodTile.el.getBoundingClientRect();
            snCx = rect.left + rect.width / 2;
            snCy = rect.top + rect.height / 2;
          } else {
            snCx = window.innerWidth / 2;
            snCy = window.innerHeight / 2;
          }
          triggerSupernova('nova', snCx, snCy);
        }
        const ring = fxDef.supernova ? 160 : 44;
        fx.push(fxSpeed({ x: cx, y: cy, type: 'flash', absorb: false, life: 0, maxLife: 0.45, ring }));
        if (!fxDef.supernova) {
          // 第二道冲击波：更大一圈的淡金光环，增强聚变爆发感
          fx.push(fxSpeed({ x: cx, y: cy, type: 'flash', absorb: false, life: 0.1, maxLife: 0.52, ring: ring * 1.9 }));
        }
        startFx();
      }

      function fxGlow(ctx, color, blur) {
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
      }

      function drawParticle(ctx, p) {
        const k = 1 - p.life / p.maxLife;
        ctx.globalAlpha = Math.min(1, k * 1.15);
        if (p.type === 'flash') {
          const rad = p.ring * (1 - k) + 4;
          fxGlow(ctx, 'rgba(255,220,120,1)', 18);
          ctx.fillStyle = 'rgba(255,214,120,' + (k * 0.55) + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,246,180,0.95)';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
          return;
        }
        if (p.type === 'alp') {
          fxGlow(ctx, '#ff5722', 12);
          fxDot(ctx, p.x, p.y, 5, '#ff5722');
          fxDot(ctx, p.x, p.y, 2, '#fff3e0');
        } else if (p.type === 'p') {
          fxGlow(ctx, '#29b6f6', 10);
          fxDot(ctx, p.x, p.y, 3.6, '#4fc3f7');
          fxDot(ctx, p.x, p.y, 1.4, '#e1f5fe');
        } else if (p.type === 'n') {
          fxGlow(ctx, '#90a4ae', 8);
          fxDot(ctx, p.x, p.y, 3.6, '#b0bec5');
        } else if (p.type === 'e+') {
          fxGlow(ctx, '#ffd54f', 10);
          fxDot(ctx, p.x, p.y, 2.8, '#ffd54f');
          fxDot(ctx, p.x, p.y, 1.1, '#fffde7');
        } else if (p.type === 'nu') {
          fxGlow(ctx, '#ffffff', 6);
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(p.x - p.vx * 0.09, p.y - p.vy * 0.09);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        } else if (p.type === 'gam') {
          fxGlow(ctx, '#ffe082', 12);
          fxDot(ctx, p.x, p.y, 3, '#ffe082');
          ctx.strokeStyle = 'rgba(255,236,120,0.95)';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(p.x, p.y, (1 - k) * 24 + 3, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }

      function fxTick(now) {
        const ctx = fxCtx;
        const w = gameEl.clientWidth || TOTAL_W;
        const h = gameEl.clientHeight || TOTAL_H;
        ctx.clearRect(0, 0, w, h);
        // 真实流逝时间推进（上限 1/30）：标签页隐藏时 rAF 暂停，
        // 切回后粒子按此步长快速走完/过期，不会积压成批同时播放
        const dt = lastFxTime ? Math.min(1 / 30, (now - lastFxTime) / 1000) : 1 / 60;
        lastFxTime = now;
        for (let i = fx.length - 1; i >= 0; i -= 1) {
          const p = fx[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            fx.splice(i, 1);
            continue;
          }
          if (p.type !== 'flash') {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.88;
            p.vy *= 0.88;
          }
          drawParticle(ctx, p);
        }
        if (fx.length) {
          requestAnimationFrame(fxTick);
        } else {
          fxRunning = false;
          lastFxTime = 0;
          ctx.clearRect(0, 0, w, h);
        }
      }

      function startFx() {
        // 播放前按当前布局重校画布（重进页面后 DPR/尺寸可能已变化）
        sizeFx();
        if (fxRunning) return;
        fxRunning = true;
        lastFxTime = 0;
        requestAnimationFrame(fxTick);
      }

      function sizeFx() {
        // 画布尺寸跟随 #game（粒子坐标空间）；布局未就绪时回退到设计尺寸，
        // 避免重进页面（bfcache 还原/切回标签页）时按 0 尺寸缩放导致特效变小/移位
        const dpr = window.devicePixelRatio || 1;
        const w = gameEl.clientWidth || TOTAL_W;
        const h = gameEl.clientHeight || TOTAL_H;
        fxCanvas.width = Math.round(w * dpr);
        fxCanvas.height = Math.round(h * dpr);
        fxCanvas.style.width = w + 'px';
        fxCanvas.style.height = h + 'px';
        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // ---------- 超新星合成庆典特效（人工轰击合成重元素时，以 Au 为中心爆发） ----------
      const snCanvas = document.getElementById('supernova');
      const snCtx = snCanvas.getContext('2d');
      const sn = { active: false, t: 0, duration: 1.5, ringDelays: [], debris: [], tone: 'nova', cx: 0, cy: 0 };
      // 上一帧时间戳：超新星按真实流逝时间推进（后台切回时快速播完）
      let lastSnTime = 0;

      function sizeSupernova() {
        // 每次播放前按当前视口与 DPR 重新校准，避免重进页面后画布缩放/位移异常
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth || 1;
        const h = window.innerHeight || 1;
        snCanvas.width = Math.round(w * dpr);
        snCanvas.height = Math.round(h * dpr);
        snCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // tone: 'nova'=轰击合成突破（成功合成重元素，金色，以 Au 为中心）；
      //       'boom'=堆芯热量失控（游戏失败，红色，以屏幕中心为爆心）
      function triggerSupernova(tone, cx, cy) {
        sizeSupernova();
        const first = !sn.active;
        sn.active = true;
        sn.t = 0;
        lastSnTime = 0;
        sn.tone = tone === 'boom' ? 'boom' : 'nova';
        Sound[sn.tone === 'boom' ? 'boom' : 'star']();
        snCanvas.style.display = 'block';
        sn.cx = Number.isFinite(cx) ? cx : window.innerWidth / 2;
        sn.cy = Number.isFinite(cy) ? cy : window.innerHeight / 2;
        sn.ringDelays = [0, 0.16, 0.34];
        sn.debris = [];
        const hueA = sn.tone === 'boom' ? '#ff8a70' : '#fff3d0';
        const hueB = sn.tone === 'boom' ? '#ffd9c0' : '#ffb74d';
        for (let i = 0; i < 150; i += 1) {
          const ang = Math.random() * Math.PI * 2;
          const speed = 300 + Math.random() * 640;
          sn.debris.push({
            x: sn.cx,
            y: sn.cy,
            vx: Math.cos(ang) * speed,
            vy: Math.sin(ang) * speed,
            size: 1.5 + Math.random() * 3,
            hue: Math.random() < 0.5 ? hueA : hueB,
            life: 0,
            maxLife: 0.6 + Math.random() * 0.7
          });
        }
        if (first) {
          requestAnimationFrame(supernovaTick);
        }
      }

      function supernovaTick(now) {
        const ctx = snCtx;
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        const cx = sn.cx;
        const cy = sn.cy;
        // 真实流逝时间推进（上限 1/30）：后台切回后超新星快速播完，不残留冻结画面
        const dt = lastSnTime ? Math.min(1 / 30, (now - lastSnTime) / 1000) : 1 / 60;
        lastSnTime = now;
        sn.t += dt;
        // 冲击波半径按"中心到最远视口角"实时计算，保证始终铺满全屏
        // （不依赖触发瞬间的窗口尺寸，缩放/位移异常可自愈）
        const maxR = Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy));

        // 全屏柔光闪白：以 Au 为爆心的径向渐变，向外渐隐
        const flashA = Math.max(0, 0.92 * (1 - sn.t / 0.42));
        if (flashA > 0.001) {
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
          grad.addColorStop(0, sn.tone === 'boom' ? 'rgba(255,96,60,' + flashA + ')' : 'rgba(255,250,235,' + flashA + ')');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        for (let i = 0; i < sn.ringDelays.length; i += 1) {
          const rt = (sn.t - sn.ringDelays[i]) / (sn.duration - sn.ringDelays[i]);
          if (rt < 0 || rt > 1) {
            continue;
          }
          const rad = maxR * Math.sqrt(rt);
          const a = (1 - rt) * 0.85;
          ctx.save();
          ctx.shadowColor = sn.tone === 'boom' ? 'rgba(255,110,70,0.95)' : 'rgba(255,214,140,0.95)';
          ctx.shadowBlur = 32;
          ctx.strokeStyle = sn.tone === 'boom' ? 'rgba(255,150,110,' + a + ')' : 'rgba(255,236,170,' + a + ')';
          ctx.lineWidth = (16 - i * 4) * (1 - rt) + 2;
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (let i = sn.debris.length - 1; i >= 0; i -= 1) {
          const d = sn.debris[i];
          d.life += dt;
          if (d.life >= d.maxLife) {
            sn.debris.splice(i, 1);
            continue;
          }
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.vx *= 0.95;
          d.vy *= 0.95;
          const a = 1 - d.life / d.maxLife;
          ctx.save();
          ctx.shadowColor = d.hue;
          ctx.shadowBlur = 14;
          ctx.globalAlpha = a;
          ctx.fillStyle = d.hue;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (sn.t < sn.duration || sn.debris.length) {
          requestAnimationFrame(supernovaTick);
        } else {
          sn.active = false;
          snCanvas.style.display = 'none';
          ctx.clearRect(0, 0, w, h);
        }
      }

      // ---------- 切伦科夫辐射（★ 越多，地图边框外放射状粒子越强、越长） ----------
      // 棋盘外露边（含朝外法线），供从边框向外放射粒子
      const cherenkov = {
        streaks: [],
        running: false,
        intensity: 0,
        weight: 0,
        edges: null,
        flare: { active: false, t: 0, duration: 3, rays: [] }
      };
      let lastCherenkovTime = 0;

      // 辐射权重：普通★ = 1，超级★ = 3（增益等同三颗普通★）
      function radiationWeight() {
        let w = 0;
        for (const tile of grid.values()) {
          if (tile.value === SUPER_STAR_VALUE) {
            w += SUPER_STAR_RADIATION_WEIGHT;
          } else if (tile.value === 999) {
            w += 1;
          }
        }
        return w;
      }

      function buildBoardEdges() {
        if (cherenkov.edges) {
          return cherenkov.edges;
        }
        const hw = CELL_W / 2;
        const hh = CELL_H / 2;
        // 六角格相对中心的六个角（与 clip-path 多边形一致）
        const rel = [
          [0, -hh], [hw, -hh / 2], [hw, hh / 2],
          [0, hh], [-hw, hh / 2], [-hw, -hh / 2]
        ];
        // 边 i 对应的邻居方向（DIRS 索引）：边中点方向即该边的朝外法线
        const edgeForDir = [1, 0, 5, 4, 3, 2];
        const cellSet = new Set(CELLS.map(keyOf));
        const segs = [];
        for (const cell of CELLS) {
          const p = hexToPixel(cell.q, cell.r);
          const px = CENTER_X + p.x;
          const py = CENTER_Y + p.y;
          for (let k = 0; k < 6; k += 1) {
            const nb = DIRS[k];
            if (!cellSet.has(key(cell.q + nb.q, cell.r + nb.r))) {
              const ei = edgeForDir[k];
              const a = rel[ei];
              const b = rel[(ei + 1) % 6];
              const nv = hexToPixel(nb.q, nb.r);
              const len = Math.hypot(nv.x, nv.y) || 1;
              segs.push({
                ax: px + a[0],
                ay: py + a[1],
                bx: px + b[0],
                by: py + b[1],
                nx: nv.x / len,
                ny: nv.y / len
              });
            }
          }
        }
        cherenkov.edges = segs;
        return segs;
      }

      // 辐射权重 → 强度（0~1）：权重 1（1★）0.6，2 0.8，3 及以上 1.0
      function cherenkovIntensity() {
        const w = radiationWeight();
        if (w === 0) {
          return 0;
        }
        return Math.min(1, 0.4 + w * 0.2);
      }

      function sizeCherenkov() {
        const dpr = window.devicePixelRatio || 1;
        const w = gameEl.clientWidth || TOTAL_W;
        const h = gameEl.clientHeight || TOTAL_H;
        cherenkovCanvas.width = Math.round(w * dpr);
        cherenkovCanvas.height = Math.round(h * dpr);
        cherenkovCanvas.style.width = w + 'px';
        cherenkovCanvas.style.height = h + 'px';
        cherenkovCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function cherenkovTick(now) {
        const ctx = cherenkovCtx;
        const w = gameEl.clientWidth || TOTAL_W;
        const h = gameEl.clientHeight || TOTAL_H;
        ctx.clearRect(0, 0, w, h);
        // 真实时间推进（钳制上限）：后台切回时残留粒子快速走完
        const dt = lastCherenkovTime ? Math.min(1 / 30, (now - lastCherenkovTime) / 1000) : 1 / 60;
        lastCherenkovTime = now;
        const intensity = cherenkov.intensity;
        const weight = cherenkov.weight;
        if (intensity > 0) {
          // 每帧按强度补充放射状粒子（1~3 条）；每条长度随 ★ 权重增长
          const edges = buildBoardEdges();
          const spawnN = intensity >= 0.95 ? 3 : intensity >= 0.7 ? 2 : 1;
          const lenFactor = 1 + weight * 0.4;
          for (let i = 0; i < spawnN && cherenkov.streaks.length < 90; i += 1) {
            const e = edges[Math.floor(Math.random() * edges.length)];
            const t = Math.random();
            // 锥形散布：朝外法线 ±0.45 rad
            const angle = Math.atan2(e.ny, e.nx) + (Math.random() - 0.5) * 0.9;
            const speed = (130 + Math.random() * 170) * (0.8 + intensity * 0.6);
            cherenkov.streaks.push({
              x: e.ax + (e.bx - e.ax) * t,
              y: e.ay + (e.by - e.ay) * t,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 0,
              maxLife: 0.5 + Math.random() * 0.7 + weight * 0.06,
              width: 1 + Math.random() * 1.6,
              intensity,
              len: lenFactor
            });
          }
        }
        // 三★合并边框爆发：强烈明显的多色放射光效（持续数秒）
        const flare = cherenkov.flare;
        if (flare.active) {
          flare.t += dt;
          const ft = Math.min(1, flare.t / flare.duration);
          const fade = 1 - ft;
          const rayLen = 70 + 180 * fade;
          const lw = 1.5 + 2.5 * fade;
          for (const ray of flare.rays) {
            const hue = (ray.hue + ft * 360) % 360;
            const ang = Math.atan2(ray.ny, ray.nx) + (Math.random() - 0.5) * 0.35;
            const ex = ray.x + Math.cos(ang) * rayLen;
            const ey = ray.y + Math.sin(ang) * rayLen;
            ctx.save();
            ctx.strokeStyle = 'hsla(' + hue + ', 100%, 65%, ' + (fade * 0.85) + ')';
            ctx.lineWidth = lw;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'hsla(' + hue + ', 100%, 60%, ' + (fade * 0.8) + ')';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(ray.x, ray.y);
            ctx.lineTo(ex, ey);
            ctx.stroke();
            ctx.restore();
          }
          if (ft >= 1) {
            flare.active = false;
          }
        }
        for (let i = cherenkov.streaks.length - 1; i >= 0; i -= 1) {
          const s = cherenkov.streaks[i];
          s.life += dt;
          if (s.life >= s.maxLife) {
            cherenkov.streaks.splice(i, 1);
            continue;
          }
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vx *= 0.9;
          s.vy *= 0.9;
          const k = 1 - s.life / s.maxLife;
          const alpha = k * k * 0.5 * s.intensity;
          if (alpha <= 0.01) {
            continue;
          }
          // 切伦科夫蓝：细长光迹从尾到头渐亮（长度随 ★ 权重增长）
          ctx.strokeStyle = 'rgba(96, 196, 255, ' + alpha + ')';
          ctx.lineWidth = s.width * k + 0.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(s.x - s.vx * 0.07 * s.len, s.y - s.vy * 0.07 * s.len);
          ctx.lineTo(s.x, s.y);
          ctx.stroke();
        }
        if (cherenkov.intensity > 0 || cherenkov.streaks.length || cherenkov.flare.active) {
          requestAnimationFrame(cherenkovTick);
        } else {
          cherenkov.running = false;
          lastCherenkovTime = 0;
          ctx.clearRect(0, 0, w, h);
        }
      }

      // 三颗★合并：边框爆发多色放射光效（数秒）+ 号角音效
      function triggerCherenkovFlare() {
        const edges = buildBoardEdges();
        const rays = [];
        for (let i = 0; i < 28; i += 1) {
          const e = edges[Math.floor(Math.random() * edges.length)];
          const t = Math.random();
          rays.push({
            x: e.ax + (e.bx - e.ax) * t,
            y: e.ay + (e.by - e.ay) * t,
            nx: e.nx,
            ny: e.ny,
            hue: (i / 28) * 360
          });
        }
        cherenkov.flare = { active: true, t: 0, duration: 3, rays };
        Sound.star();
        // 确保辐射循环在运行（此时至少 3★，权重≥3）
        updateCherenkov();
      }

      // 根据当前 ★ 数量启停/更新辐射强度
      function updateCherenkov() {
        cherenkov.weight = radiationWeight();
        cherenkov.intensity = cherenkovIntensity();
        if (cherenkov.intensity <= 0) {
          cherenkov.streaks.length = 0;
          if (cherenkov.running) {
            cherenkov.running = false;
            lastCherenkovTime = 0;
            const w = gameEl.clientWidth || TOTAL_W;
            const h = gameEl.clientHeight || TOTAL_H;
            cherenkovCtx.clearRect(0, 0, w, h);
          }
          return;
        }
        sizeCherenkov();
        if (!cherenkov.running) {
          cherenkov.running = true;
          lastCherenkovTime = 0;
          requestAnimationFrame(cherenkovTick);
        }
      }

      // 只滑动、不合并（聚变合并交给聚变规则）
      function slideOnly(grid, direction) {
        const moves = [];
        for (const lane of getLanes(direction)) {
          const segments = [];
          let seg = [];
          for (let i = 0; i < lane.length; i += 1) {
            if (seg.length === 0) {
              seg.push(lane[i]);
              continue;
            }
            const prev = seg[seg.length - 1];
            const cur = lane[i];
            if (cur.q - prev.q === -direction.q && cur.r - prev.r === -direction.r) {
              seg.push(cur);
            } else {
              segments.push(seg);
              seg = [cur];
            }
          }
          if (seg.length) {
            segments.push(seg);
          }
          for (const laneSeg of segments) {
            const compact = [];
            for (const cell of laneSeg) {
              const tile = grid.get(keyOf(cell));
              if (tile) {
                compact.push(tile);
              }
            }
            for (let i = 0; i < compact.length; i += 1) {
              const target = laneSeg[i];
              const tile = compact[i];
              if (tile.q !== target.q || tile.r !== target.r) {
                moves.push({ tile, fromQ: tile.q, fromR: tile.r, toQ: target.q, toR: target.r });
              }
            }
          }
        }
        return moves.length ? moves : null;
      }

      function applyMoves(moves) {
        for (const move of moves) {
          grid.delete(key(move.fromQ, move.fromR));
        }
        for (const move of moves) {
          grid.set(key(move.toQ, move.toR), move.tile);
          move.tile.q = move.toQ;
          move.tile.r = move.toR;
          setTileTransform(move.tile.el, move.toQ, move.toR);
        }
      }

      // 找中心格周围第一个空位（放置多原子反应的副产物）
      function findEmptyNeighbor(grid, center) {
        for (const d of DIRS) {
          const q = center.q + d.q;
          const r = center.r + d.r;
          if (CELLS.some((c) => c.q === q && c.r === r) && !grid.has(key(q, r))) {
            return { q, r };
          }
        }
        return null;
      }

      // 从反应中心向外 BFS，找最近的空位（放置产物多于参与原子时的多余产物；
      // 不再局限于中心的 6 个直接邻居，避免原子因附近无空位而消失）
      function findNearestEmptySpot(grid, center, taken) {
        const queue = [{ q: center.q, r: center.r }];
        const visited = new Set();
        while (queue.length) {
          const cur = queue.shift();
          const k = key(cur.q, cur.r);
          if (!BOARD_KEYS.has(k) || visited.has(k)) {
            continue;
          }
          visited.add(k);
          if (!grid.has(k) && !taken.has(k)) {
            return { q: cur.q, r: cur.r };
          }
          for (const d of DIRS) {
            queue.push({ q: cur.q + d.q, r: cur.r + d.r });
          }
        }
        return null;
      }

      function applyFusionWave(wave, speedScale = 1, instant = false) {
        // 级联加速：本波粒子特效按同一倍速播放（倍速>1 时更快）；瞬时结算不加速
        fxTimeScale = instant ? 1 : 1 / speedScale;
        const consumed = new Set();
        for (const r of wave) {
          for (const t of r.tiles) {
            consumed.add(t.id);
          }
        }
        const doomed = [];
        for (const tile of grid.values()) {
          if (consumed.has(tile.id)) {
            doomed.push(tile);
          }
        }
        for (const tile of doomed) {
          grid.delete(key(tile.q, tile.r));
        }
        if (instant) {
          // 不显示反应过程：直接移除参与原子，不做坍缩棋子动画；
          // 但保留粒子效果动画（内聚粒子），且不阻塞玩家输入
          for (const tile of doomed) {
            removeTileElement(tile);
          }
          for (const r of wave) {
            const cc = hexToPixel(r.center.q, r.center.r);
            const ccx = CENTER_X + cc.x;
            const ccy = CENTER_Y + cc.y;
            for (const t of r.tiles) {
              if (!t.el) {
                continue;
              }
              const pt = hexToPixel(t.q, t.r);
              for (let i = 0; i < 5; i += 1) {
                fxInward(
                  CENTER_X + pt.x + (Math.random() - 0.5) * 34,
                  CENTER_Y + pt.y + (Math.random() - 0.5) * 34,
                  ccx,
                  ccy
                );
              }
            }
          }
          startFx();
        } else {
          // 聚变坍缩动画：参与原子收缩消融（延迟移除），粒子向各自反应中心内聚
          for (const r of wave) {
            const cc = hexToPixel(r.center.q, r.center.r);
            const ccx = CENTER_X + cc.x;
            const ccy = CENTER_Y + cc.y;
            for (const t of r.tiles) {
              if (!t.el) {
                continue;
              }
              const inner = t.el.querySelector('.tile-inner');
              inner.classList.add('tile-implode');
              // 级联加速：按本波倍速缩短坍缩动画时长
              inner.style.animationDuration = (IMPLODE_MS / 1000 * speedScale) + 's';
              lingeringTiles.push(t.el);
              const pt = hexToPixel(t.q, t.r);
              for (let i = 0; i < 5; i += 1) {
                fxInward(
                  CENTER_X + pt.x + (Math.random() - 0.5) * 34,
                  CENTER_Y + pt.y + (Math.random() - 0.5) * 34,
                  ccx,
                  ccy
                );
              }
              window.setTimeout(() => {
                const idx = lingeringTiles.indexOf(t.el);
                if (idx >= 0) {
                  lingeringTiles.splice(idx, 1);
                }
                removeTileElement(t);
              }, IMPLODE_MS * speedScale);
            }
          }
          startFx();
        }
        // 本波所有反应的参与原子位置，供多余副产物避让
        const taken = new Set();
        for (const r of wave) {
          for (const t of r.tiles) {
            taken.add(key(t.q, t.r));
          }
        }
        for (const r of wave) {
          // 参与原子按 从左到右、从上到下 排序（像素坐标 x 优先，再 y）
          const spots = r.tiles.slice().sort((a, b) => {
            const pa = hexToPixel(a.q, a.r);
            const pb = hexToPixel(b.q, b.r);
            return pa.x - pb.x || pa.y - pb.y;
          });
          // 新原子序列：主产物 + 副产物，依次占据原位置
          const atoms = [r.product, ...(r.byproducts || [])];
          atoms.forEach((value, i) => {
            let spot;
            if (i < spots.length) {
              spot = { q: spots[i].q, r: spots[i].r };
            } else {
              // 产物多于参与原子（如 He³+He³→He⁴+2H）：从反应中心向外 BFS
              // 找最近的空位，避免因附近无空位而丢失产物原子
              spot = findNearestEmptySpot(grid, r.center, taken);
            }
            if (!spot) {
              return;
            }
            taken.add(key(spot.q, spot.r));
            // 产物原子生成动画：瞬时结算（不显示反应过程）时同样保留，不阻塞玩家输入
            const tile = createTile(value, spot.q, spot.r, i >= spots.length);
            if (i === 0) {
              const inner = tile.el.querySelector('.tile-inner');
              if (value === SUPER_STAR_VALUE) {
                // 超级★：自带爆裂+多彩流动动画（.tile-star），不再叠加 tile-fusion
                triggerCherenkovFlare();
              } else {
                inner.classList.add('tile-fusion');
                // 级联加速：按本波倍速缩短爆裂动画时长（瞬时结算为 1 倍速）
                inner.style.animationDuration = (FUSION_BURST_MS / 1000 * speedScale) + 's';
              }
              // 粒子效果动画：瞬时结算时也播放，不阻塞玩家输入
              spawnFusionParticles(spot.q, spot.r, r.product);
              // 合成出第一个人工元素（★）：解锁强化（每回合散热 3 + ★ 周围生成 H/D 燃料）
              if (!artificialUnlocked && ARTIFICIAL_VALUES.has(r.product)) {
                artificialUnlocked = true;
                updateHeatTitle();
              }
            }
          });
          fusionHistory.push(describeReactionHtml(r));
        }
        renderFusionLog();
      }

      // 聚变反应描述："¹H + ¹H → ²D"、"³He + ³He → ⁴He + ¹H + ¹H"（质量数作左上角标，整数；
      // 氘 ²H 与棋子一致记作 D，并同样标注质量角标）
      function massTag(value) {
        if (value === 999 || value === 1000) {
          return ''; // ★ / 超级★ 为游戏终点，不标质量
        }
        return '<sup>' + value + '</sup>';
      }
      function describeReactionHtml(r) {
        const needs = r.recipe.needs;
        const parts = [];
        for (const v in needs) {
          const nv = Number(v);
          const n = Number(needs[v]);
          const sym = elementSymbol(nv) || v;
          parts.push('<span class="fp-atom">' + (n > 1 ? n + ' × ' : '') + massTag(nv) + sym + '</span>');
        }
        let prod = (elementSymbol(r.product) || r.product);
        if (massTag(r.product)) {
          prod = massTag(r.product) + prod;
        }
        for (const bv of r.byproducts || []) {
          const b = Number(bv);
          prod += ' + ' + massTag(b) + (elementSymbol(b) || b);
        }
        return parts.join('<span class="fp-plus">+</span>') +
          '<span class="fp-arrow">→</span><span class="fp-prod">' + prod + '</span>' +
          (r.recipe.neutronBurst ? '<span class="fp-note">（中子暴）</span>' : '');
      }

      // 当前热度上限：合成出第一个人工元素（★）后由 16 提升到 32
      function currentHeatLimit() {
        return artificialUnlocked ? HEAT_LIMIT_AFTER_ARTIFICIAL : HEAT_LIMIT_BASE;
      }

      // 热量框提示：散热按 ★ 数量线性叠加；合成出第一个人工元素（★）后上限提升
      function updateHeatTitle() {
        const base = formatCool(heatCoolPerMove);
        heatBoxEl.title = artificialUnlocked
          ? '堆芯热量：每次聚变 +1；每回合散热基础值 ' + base + '（每个 ★ 额外 +1）；达到上限失控，点「继续游戏」清空热量（合成 ★ 后上限 ' + HEAT_LIMIT_AFTER_ARTIFICIAL + '）'
          : '堆芯热量：每次聚变 +1；每回合散热基础值 ' + base + '（每个 ★ 额外 +1）；达到上限失控，点「继续游戏」清空热量（合成 ★ 后上限提升至 ' + HEAT_LIMIT_AFTER_ARTIFICIAL + '）';
      }

      // 更新热量显示与危险等级（animate=true 时数字跳动一下）
      function updateHeatUI(animate) {
        // 冷却值（1.3/1.6 等）在二进制中不精确，累加会带出长串小数，显示前四舍五入到一位小数
        const lim = currentHeatLimit();
        heatEl.textContent = Math.round(heat * 10) / 10;
        heatLimitEl.textContent = lim;
        heatBoxEl.classList.remove('heat-l0', 'heat-l1', 'heat-l2', 'heat-l3');
        // 等级阈值按当前上限比例划分，上限提升（合成 ★ 后 16→32）自动适配
        const lvl = heat >= lim * 0.85 ? 3 : heat >= lim * 0.55 ? 2 : heat >= lim * 0.3 ? 1 : 0;
        heatBoxEl.classList.add('heat-l' + lvl);
        heatBoxEl.classList.remove('heat-pop');
        if (animate) {
          void heatBoxEl.offsetWidth;
          heatBoxEl.classList.add('heat-pop');
        }
      }

      // 渲染"上一步聚变"信息（棋盘/按钮下方）
      function renderFusionLog() {
        const logEl = document.getElementById('fusionLog');
        logEl.textContent = '';
        if (fusionHistory.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'fp-empty';
          empty.textContent = '暂无聚变';
          logEl.appendChild(empty);
          return;
        }
        for (const html of fusionHistory) {
          const item = document.createElement('div');
          item.className = 'fp-item';
          item.innerHTML = html;
          logEl.appendChild(item);
        }
        // 聚变栏高度已固定，棋盘尺寸不随日志行数变化，无需重新 fitGame
      }

      // ---------- 音效（Web Audio 合成，无外部资源） ----------
      const Sound = (() => {
        let ctx = null;
        function ensure() {
          if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) {
              return null;
            }
            ctx = new AC();
          }
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          return ctx;
        }
        // 单音：f0→f1 频率滑音，包络淡入淡出
        function tone(type, f0, f1, dur, vol, delay) {
          const c = ensure();
          if (!c) {
            return;
          }
          const t0 = c.currentTime + (delay || 0);
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f0, t0);
          if (f1 && f1 !== f0) {
            osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
          }
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.05);
        }
        // 噪声（滤波后作"气流/轰响"）
        function noise(dur, vol, freq) {
          const c = ensure();
          if (!c) {
            return;
          }
          const t0 = c.currentTime;
          const len = Math.max(1, Math.floor(c.sampleRate * dur));
          const buf = c.createBuffer(1, len, c.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i += 1) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / len);
          }
          const src = c.createBufferSource();
          src.buffer = buf;
          const flt = c.createBiquadFilter();
          flt.type = 'lowpass';
          flt.frequency.value = freq || 900;
          const gain = c.createGain();
          gain.gain.setValueAtTime(vol, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          src.connect(flt);
          flt.connect(gain);
          gain.connect(c.destination);
          src.start(t0);
        }
        return {
          unlock() {
            ensure();
          },
          move() {
            // 滑动：轻柔短促的气流
            noise(0.09, 0.05, 700);
            tone('sine', 240, 180, 0.09, 0.045);
          },
          invalid() {
            // 无效滑动：低闷一声
            tone('triangle', 150, 110, 0.12, 0.06);
          },
          fusion() {
            // 聚变：明亮上行双音 + 高频闪烁
            tone('triangle', 520, 660, 0.09, 0.07);
            tone('sine', 780, 1040, 0.12, 0.05, 0.03);
            tone('sine', 1560, 2080, 0.14, 0.025, 0.06);
          },
          star() {
            // 合成重元素：金色号角上行琶音 + 长泛音
            [523, 659, 784, 1047].forEach((f, i) => {
              tone('triangle', f, f * 1.02, 0.3, 0.08, i * 0.07);
            });
            tone('sine', 2093, 2093, 0.6, 0.03, 0.3);
          },
          boom() {
            // 堆芯失控：低频轰鸣 + 爆裂噪声
            tone('sawtooth', 160, 36, 0.8, 0.14);
            tone('square', 90, 30, 0.9, 0.09, 0.05);
            noise(0.7, 0.1, 420);
          },
          win() {
            this.star();
          },
          lose() {
            // 游戏结束：下行小调
            [523, 440, 349, 262].forEach((f, i) => {
              tone('triangle', f, f * 0.99, 0.25, 0.07, i * 0.09);
            });
          }
        };
      })();

      function handleMove(direction) {
        // 弹窗（胜利/失控/失败）显示期间不响应移动
        if (busy || gameEnded || !overlayEl.classList.contains('hidden')) {
          return;
        }
        const moves = slideOnly(grid, direction);
        if (!moves) {
          shakeBoard();
          Sound.invalid();
          return;
        }
        Sound.move();
        busy = true;
        setArrowsDisabled(true);
        const token = moveToken;
        fusionHistory = [];
        applyMoves(moves);
        window.setTimeout(() => {
          if (token !== moveToken) {
            return;
          }
          let exploded = false;
          let fusedCount = 0;
          // 级联聚变：一波一波分步播放动画，期间 busy 保持 true，
          // 触屏、点击、键盘等外界输入一律不响应
          // 同一步操作内多波加速：第 1 波正常速度，后续每波逐渐加快
          // （波间隔缩短 + 爆裂/坍缩/粒子动画倍速）
          // 等待优化：每波应用后预计算下一波 —— 最后一波动画播完立即解锁输入，
          // 不再多等一个整段波间隔；仅多波级联时才点亮"正在反应"边框
          let waveIndex = 0;
          const step = (wave) => {
            if (token !== moveToken) {
              return;
            }
            if (document.hidden) {
              // 标签页隐藏：暂停级联（后台定时器被节流，恢复可见后再继续，避免动画积压成批播放）
              window.setTimeout(() => step(wave), 200);
              return;
            }
            if (!wave) {
              wave = computeFusionWave(grid);
            }
            if (wave.length === 0) {
              finish();
              return;
            }
            // 第 1 波 speedScale=1（正常速度），之后每波 ×CASCADE_SPEEDUP 逐渐加快
            const speedScale = Math.pow(CASCADE_SPEEDUP, waveIndex);
            // 先应用这一波（反应可视化），每次聚变 +1 热量；达到上限即堆芯失控
            applyFusionWave(wave, speedScale);
            if (fusedCount === 0) {
              Sound.fusion();
            }
            fusedCount += wave.length;
            heat += wave.length * HEAT_PER_FUSION;
            updateHeatUI(true);
            if (heat >= currentHeatLimit()) {
              exploded = true;
              finish();
              return;
            }
            waveIndex += 1;
            // 预计算下一波：决定是继续等待播放，还是播完本波立即收尾
            const nextWave = computeFusionWave(grid);
            if (nextWave.length === 0) {
              // 最后一波：本波爆裂动画播完（×倍速）立即解锁，去掉多余的整段等待
              window.setTimeout(finish, FUSION_BURST_MS * speedScale);
              return;
            }
            // 还有后续波：亮起"正在反应"边框，波间隔随波次缩短（逐渐加快）
            mapOutlineEl.classList.add('reacting');
            const delay = Math.max(CASCADE_MIN_DELAY_MS, CASCADE_STEP_MS * speedScale);
            window.setTimeout(() => step(nextWave), delay);
          };
          const finish = () => {
            if (token !== moveToken) {
              return;
            }
            // 级联结束：恢复粒子倍速、熄灭"正在反应"边框高亮
            fxTimeScale = 1;
            mapOutlineEl.classList.remove('reacting');
            if (!exploded) {
              // 每回合自然冷却：基础散热（UI 可调）+ 每个 ★ 额外 1
              // （默认 1.5：0 个★ 降 1.5，1 个★ 降 2.5，2 个★ 降 3.5，依此类推）
              const cool = heatCoolPerMove + HEAT_COOL_PER_STAR * countArtificial();
              heat = Math.max(0, heat - cool);
              updateHeatUI(false);
              addRandomTile();
              // 人工元素强化：每回合在每个人工元素周围随机生成一个 H/D 燃料
              spawnFuelAroundArtificial();
              // ★ 数量变化 → 更新切伦科夫辐射强度
              updateCherenkov();
            }
            busy = false;
            setArrowsDisabled(false);
            if (exploded) {
              // 超阈值：不判负，提供"继续游戏"清空热量后重新点火
              boomContinue = true;
              fusionHistory.push('<span class="fp-boom">堆芯失控!</span>');
              renderFusionLog();
              triggerSupernova('boom');
              shakeBoard();
              showOverlay('堆芯失控!', '聚变装置温度飙升至上限，等离子体挣脱约束、失控爆发。点击「继续游戏」清空热量，重新点火。', true);
            } else {
              checkEndState();
            }
          };
          if (!showReaction) {
            // 不显示反应过程：所有连锁波瞬间结算，无动画/无粒子/无声效/无边框提示，
            // 结算完立即解锁输入
            for (;;) {
              const wave = computeFusionWave(grid);
              if (wave.length === 0) {
                break;
              }
              applyFusionWave(wave, 1, true);
              fusedCount += wave.length;
              heat += wave.length * HEAT_PER_FUSION;
              if (heat >= currentHeatLimit()) {
                exploded = true;
                break;
              }
            }
            updateHeatUI(false);
            finish();
            return;
          }
          step();
        }, MOVE_MS);
      }

      function shakeBoard() {
        boardEl.classList.remove('shake');
        void boardEl.offsetWidth;
        boardEl.classList.add('shake');
      }

      function currentMaxTile() {
        let max = 0;
        for (const tile of grid.values()) {
          max = Math.max(max, tile.value);
        }
        return max;
      }

      function checkEndState() {
        if (gameEnded) {
          return;
        }

        if (!won && currentMaxTile() >= 999) {
          won = true;
          showWinOverlay();
          return;
        }

        if (!hasAnyMove(grid)) {
          gameEnded = true;
          showLoseOverlay();
        }
      }

      function showOverlay(title, text, showKeepGoing) {
        overlayTitleEl.textContent = title;
        overlayTextEl.textContent = text;
        keepGoingBtn.classList.toggle('hidden', !showKeepGoing);
        overlayEl.classList.remove('hidden');
      }

      function hideOverlay() {
        overlayEl.classList.add('hidden');
      }

      function showWinOverlay() {
        showOverlay('合成出超重核!', '你在聚变装置里轰击双铀，造出了人造元素 ★。继续合成更重的核素？', true);
        Sound.win();
      }

      function showLoseOverlay() {
        showOverlay('Game over', 'No valid moves remain. Try again!', false);
        Sound.lose();
      }

      function keepGoing() {
        hideOverlay();
        gameEnded = false;
        // 堆芯失控后继续：清空热量，重新点火
        if (boomContinue) {
          boomContinue = false;
          heat = 0;
          updateHeatUI(false);
        }
        setArrowsDisabled(false);
      }

      // 旋转后棋盘内容的近似外接圆半径（格子 + 方向按钮）；旋转不改变包围圆，
      // 按圆适配即可保证 30° 旋转后不裁切
      const MAP_RADIUS = ARROW_DIST + 34;

      function fitGame() {
        const width = Math.max(0, viewportEl.clientWidth - 16);
        const bar = fusionBarEl.offsetHeight || 0;
        // 按内容包围圆缩放（预留两倍栏高+边距，视觉底部才不会盖住
        // 固定在视口底部的聚变信息栏）
        const diameter = 2 * MAP_RADIUS;
        const height = Math.max(0, viewportEl.clientHeight - 16 - 2 * bar);
        // 布局未就绪（如重进浏览器/还原标签页瞬间）时视口尺寸可能为 0，
        // 钳制缩放系数，避免棋盘被压成负/微小尺寸而"变小并移位"
        const scale = Math.max(0.1, Math.min(width / diameter, height / diameter, 1));
        // 地图上移：居中位置整体上移（最多 64px），拉近与顶部分数栏的距离；
        // 上移只会加大底部留白，聚变栏始终安全；顶部至少保留 8px 边距
        const slack = (viewportEl.clientHeight - diameter * scale) / 2;
        const shift = Math.max(0, Math.min(slack - 8, 64));
        boardWrapEl.style.transform =
          'translateY(' + -shift.toFixed(1) + 'px) scale(' + scale + ') rotate(-30deg)';
      }

      buildBoardCells();
      buildArrowButtons();
      startNewGame();
      fitGame();
      sizeFx();
      sizeSupernova();

      // 反应过程显示/隐藏切换按钮：同步文案、置灰样式与本地存储
      function updateReactionBtn() {
        toggleReactionBtn.textContent = showReaction ? '反应过程：显示' : '反应过程：隐藏';
        toggleReactionBtn.classList.toggle('off', !showReaction);
        toggleReactionBtn.title = showReaction
          ? '当前显示聚变反应过程动画；点击切换为不显示（瞬间结算）'
          : '当前不显示聚变反应过程动画（瞬间结算，无边框提示）；点击切换为显示';
      }
      updateReactionBtn();
      toggleReactionBtn.addEventListener('click', () => {
        showReaction = !showReaction;
        saveShowReaction();
        updateReactionBtn();
      });

      // 散热率输入框：初始值 = 当前散热（持久化），提交后生效并保存
      coolInput.value = formatCool(heatCoolPerMove);
      coolInput.addEventListener('input', () => {
        const raw = coolInput.value.trim();
        if (raw === '') {
          return;
        }
        const v = Number.parseFloat(raw);
        if (Number.isFinite(v) && (v < 0 || v > 30)) {
          coolInput.value = formatCool(Math.min(30, Math.max(0, v)));
        }
      });
      coolInput.addEventListener('change', () => {
        const raw = coolInput.value.trim();
        const v = Number.parseFloat(raw);
        if (!Number.isFinite(v) || v < 0) {
          coolInput.value = formatCool(heatCoolPerMove);
          return;
        }
        heatCoolPerMove = Math.min(30, v);
        coolInput.value = formatCool(heatCoolPerMove);
        saveHeatCool();
        updateHeatTitle();
      });
      coolInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          coolInput.blur();
        }
      });

      newGameBtn.addEventListener('click', startNewGame);
      overlayNewGameBtn.addEventListener('click', startNewGame);
      keepGoingBtn.addEventListener('click', keepGoing);

      // 首次交互时解锁音频（浏览器自动播放策略）
      const unlockAudio = () => Sound.unlock();
      document.addEventListener('pointerdown', unlockAudio, { once: true });
      document.addEventListener('keydown', unlockAudio, { once: true });
      // 重进浏览器（bfcache 还原/切回标签页）时布局与 DPR 可能已变化：
      // resize 之外再挂 pageshow 与 rAF，确保棋盘与特效画布按当前尺寸重算
      const resizeAll = () => { fitGame(); sizeFx(); sizeSupernova(); };
      window.addEventListener('resize', resizeAll);
      window.addEventListener('pageshow', resizeAll);
      // 标签页从后台切回：后台期间 rAF 暂停、粒子会冻结积压，
      // 直接清空残留粒子并停掉特效循环，避免动画堆积同时播放导致卡顿
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          fx.length = 0;
          fxRunning = false;
          lastFxTime = 0;
          sizeFx();
        }
      });
      requestAnimationFrame(resizeAll);
      window.addEventListener('keydown', (event) => {
        if (busy) {
          return;
        }

        // QWEASD 控制六方向（地图逆时针旋转 30° 后的轴向，平顶六边形）：
        //   Q=左上(NW)  W=上(NE)  E=右上(E)
        //   A=左下(W)   S=下(SW)  D=右下(SE)
        const keyDirections = {
          q: DIRS[2], // Q → NW
          w: DIRS[1], // W → NE
          e: DIRS[0], // E → E
          a: DIRS[3], // A → W
          s: DIRS[4], // S → SW
          d: DIRS[5], // D → SE
          arrowright: DIRS[0],
          arrowup: DIRS[1],
          arrowleft: DIRS[3],
          arrowdown: DIRS[5]
        };
        const direction = keyDirections[event.key.toLowerCase()];
        if (direction) {
          event.preventDefault();
          handleMove(direction);
        }
      });

      // ---------- 手势滑动：手机触屏滑动 / 电脑鼠标拖拽，等价于按方向按钮 ----------
      const SWIPE_MIN_PX = 26; // 位移大于此值才判定为滑动
      let gestureStart = null; // { x, y }
      let touchActive = false;
      let suppressMouseUntil = 0;

      // 滑动位移 → 六方向中最近的一个（复用棋盘的轴向→像素几何，保证方向对齐）
      function swipeToDir(dx, dy) {
        // 地图已逆时针旋转 30°：先把屏幕滑动向量旋回棋盘轴向坐标系（+30°）再匹配
        const cosR = Math.cos(Math.PI / 6);
        const sinR = Math.sin(Math.PI / 6);
        const rx = dx * cosR - dy * sinR;
        const ry = dx * sinR + dy * cosR;
        let best = DIRS[0];
        let bestDot = -Infinity;
        for (const d of DIRS) {
          const p = hexToPixel(d.q, d.r);
          const len = Math.hypot(p.x, p.y) || 1;
          const dot = (rx * p.x + ry * p.y) / len;
          if (dot > bestDot) {
            bestDot = dot;
            best = d;
          }
        }
        return best;
      }

      function beginGesture(x, y) {
        gestureStart = { x, y };
      }

      function endGesture(x, y) {
        if (!gestureStart) {
          return;
        }
        const dx = x - gestureStart.x;
        const dy = y - gestureStart.y;
        gestureStart = null;
        if (Math.hypot(dx, dy) < SWIPE_MIN_PX) {
          return; // 位移太小 = 点击，忽略
        }
        handleMove(swipeToDir(dx, dy));
      }

      boardEl.addEventListener('touchstart', (e) => {
        touchActive = true;
        const t = e.changedTouches[0];
        beginGesture(t.clientX, t.clientY);
      }, { passive: true });

      boardEl.addEventListener('touchmove', (e) => {
        if (e.cancelable) {
          e.preventDefault(); // 阻止下拉刷新 / 页面手势
        }
      }, { passive: false });

      boardEl.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        endGesture(t.clientX, t.clientY);
        suppressMouseUntil = Date.now() + 600; // 抑制触摸后浏览器派发的合成鼠标事件
        touchActive = false;
      }, { passive: true });

      boardEl.addEventListener('touchcancel', () => {
        gestureStart = null;
        touchActive = false;
      }, { passive: true });

      boardEl.addEventListener('mousedown', (e) => {
        if (touchActive || Date.now() < suppressMouseUntil || e.button !== 0) {
          return;
        }
        e.preventDefault();
        beginGesture(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (gestureStart) {
          e.preventDefault(); // 拖拽时禁止选中/拖放
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (gestureStart && e.button === 0) {
          endGesture(e.clientX, e.clientY);
        }
      });
    })();
  </script>
</body>
</html>
